name: Generate and publish resume PDF

on:
  push:
    branches: [ 'main' ]
    paths:
      - '.github/workflows/build-deploy.yml'
      - 'index.html'
      - 'RayMatthesResume.md'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  # Build job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # https://github.com/marketplace/actions/markdown-to-pdf-converter
      - name: Convert Markdown to PDF
        uses: narthanaj/markdown-to-pdf-action@v2.0.0
        with:
          markdown_file: './RayMatthesResume.md'
          output_dir: './'
          pdf_options: |
            {
              format: Letter,
              margin: {
                top: 0.50in,
                right: 0.75in,
                bottom: 0.75in,
                left: 0.75in
              },
              headerTemplate: '<style>section { margin: 0 auto; font-family: system-ui; font-size: 11px; }</style>',
              footerTemplate: '<section><div>Page <span class="pageNumber"></span> of <span class="totalPages"></span></div></section>'
            }

      # https://github.com/marketplace/actions/upload-github-pages-artifact
      - name: Upload pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      # https://github.com/marketplace/actions/deploy-github-pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
